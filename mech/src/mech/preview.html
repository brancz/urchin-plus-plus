<title>Urchin++</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600&family=Martian+Mono:wght@400;600&display=swap">
<style>
/* Layout: a full-bleed photo stage; the name and real dimensions sit top left like a spec label,
   finishes top right, the view switch along the bottom edge like a camera's mode dial. */
:root {
  --stage-hi: #ecebe7;
  --stage-lo: #c9c7c1;
  --ink: #17181a;
  --ink-soft: #55575c;
  --panel: rgba(250, 249, 246, 0.72);
  --line: rgba(23, 24, 26, 0.14);
  --amber: #c9781c;
  --display: "Martian Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --body: "Albert Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --stage-hi: #5b5d61;
    --stage-lo: #26272a;
    --ink: #f1f0ec;
    --ink-soft: #b4b5b8;
    --panel: rgba(30, 31, 34, 0.72);
    --line: rgba(241, 240, 236, 0.16);
    --amber: #f0a040;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --stage-hi: #5b5d61;
  --stage-lo: #26272a;
  --ink: #f1f0ec;
  --ink-soft: #b4b5b8;
  --panel: rgba(30, 31, 34, 0.72);
  --line: rgba(241, 240, 236, 0.16);
  --amber: #f0a040;
}
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  font: 15px/1.45 var(--body);
  color: var(--ink);
  background: radial-gradient(120% 90% at 50% 38%, var(--stage-hi) 0%, var(--stage-lo) 100%);
}
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hud {
  position: fixed; inset: 0; pointer-events: none;
  display: grid; grid-template-rows: auto 1fr auto; gap: 12px;
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.panel {
  pointer-events: auto;
  background: var(--panel);
  backdrop-filter: blur(14px) saturate(1.2);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.label { padding: 12px 16px; max-width: 34rem; }
h1 { margin: 0; font: 600 20px/1.1 var(--display); letter-spacing: -0.01em; }
.spec { margin: 6px 0 0; color: var(--ink-soft); font-size: 13px; font-variant-numeric: tabular-nums; }
.spec b { font: 400 12px var(--display); color: var(--ink); }
.finish { padding: 10px 12px; display: grid; gap: 8px; }
.row { display: flex; align-items: center; gap: 8px; }
.row span { font: 400 10.5px var(--display); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); width: 6.5em; }
.sw {
  width: 22px; height: 22px; border-radius: 50%; padding: 0; cursor: pointer;
  border: 1px solid var(--line); background: var(--c);
  box-shadow: inset 0 0 0 2px var(--panel);
}
.sw[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 1px; }
.pick { position: relative; width: 22px; height: 22px; border-radius: 50%; overflow: hidden; border: 1px dashed var(--ink-soft); }
.pick input { position: absolute; inset: -6px; width: 34px; height: 34px; border: 0; padding: 0; opacity: 0; cursor: pointer; }
.pick::after { content: "+"; position: absolute; inset: 0; display: grid; place-items: center; font: 400 12px var(--display); color: var(--ink-soft); pointer-events: none; }
.status { grid-row: 2; }
.bottom { grid-row: 3; display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; }
.views { display: flex; padding: 4px; gap: 2px; }
.views button, .xray {
  pointer-events: auto; cursor: pointer;
  font: 500 14px var(--body); color: var(--ink);
  background: transparent; border: 0; border-radius: 7px; padding: 8px 14px;
}
.views button[aria-pressed="true"] { background: var(--ink); color: var(--stage-hi); }
.xray { display: flex; align-items: center; gap: 8px; padding: 12px 14px; }
.xray i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--ink-soft); }
.xray[aria-pressed="true"] i { background: var(--amber); border-color: var(--amber); box-shadow: 0 0 8px var(--amber); }
button:focus-visible, .pick input:focus-visible + * { outline: 2px solid var(--amber); outline-offset: 2px; }
.hint { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(20px, env(safe-area-inset-bottom, 0px));
  font: 400 11px var(--display); color: var(--ink-soft); pointer-events: none; }
.tip {
  position: fixed; left: 0; top: 0; pointer-events: none; max-width: 18rem;
  padding: 8px 11px; font-size: 13px; line-height: 1.35;
  transform: translate(14px, 14px);
}
.tip strong { display: block; font-weight: 600; }
.tip em { font-style: normal; color: var(--ink-soft); }
.status { place-self: center; padding: 14px 18px; font: 400 13px var(--display); color: var(--ink-soft); }
@media (max-width: 720px) {
  .hint { display: none; }
  .label { max-width: none; flex: 1 1 100%; }
  .views button { padding: 8px 10px; font-size: 13.5px; }
}
</style>

<canvas id="stage" aria-label="3D model of the Urchin++ keyboard"></canvas>
<div class="hud">
  <div class="top">
    <div class="panel label">
      <h1>urchin++</h1>
      <p class="spec" id="spec">Wireless split keyboard with a charging dock</p>
    </div>
    <div class="panel finish" role="group" aria-label="Finishes">
      <div class="row" data-target="print"><span>Prints</span></div>
      <div class="row" data-target="keycap"><span>Keycaps</span></div>
    </div>
  </div>
  <div class="panel status" id="status">Unpacking the model…</div>
  <div class="bottom">
    <div class="panel views" role="group" aria-label="View">
      <button id="v-desk" data-view="desk" aria-pressed="true">On the desk</button>
      <button id="v-dock" data-view="dock" aria-pressed="false">In the dock</button>
      <button id="v-exploded" data-view="exploded" aria-pressed="false">Exploded</button>
    </div>
    <button class="panel xray" id="xray" aria-pressed="false"><i></i>X-ray</button>
  </div>
</div>
<div class="hint">Drag to turn · scroll to zoom · point at a part</div>
<div class="panel tip" id="tip" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
const META = __MESH_META__;
const DATA = "__MESH_DATA__";

const SWATCHES = [["Black", "#161616"], ["Graphite", "#4a4d52"], ["Bone", "#e4dfd3"]];
const EXPLODE = { under: -18, case: 0, pcb: 26, cell: 40, shell: 56, switch: 74, keycap: 96 };
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

function store(key, value) {
  try { if (value === undefined) return localStorage.getItem(key); localStorage.setItem(key, value); } catch (e) { return null; }
}

async function inflate(b64) {
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"));
  return new Response(stream).arrayBuffer();
}

function material(kind) {
  // three r128 takes colours as linear: convert the sRGB values. Plastics reflect the room less than metals.
  const std = (hex, roughness, metalness = 0) => new THREE.MeshStandardMaterial({
    color: new THREE.Color(hex).convertSRGBToLinear(), roughness, metalness, envMapIntensity: metalness ? 1 : 0.6 });
  const glow = color => new THREE.MeshBasicMaterial({ color, toneMapped: false });
  switch (kind) {
    case "print": return std(0x161616, 0.62);
    case "keycap": return std(0x161616, 0.78);
    case "switch": return std(0x2c2c30, 0.5);
    case "pcb": return std(0x1d5c36, 0.32);
    case "pcb-black": return std(0x141516, 0.32);
    case "metal": return std(0xc9cdd3, 0.28, 1);
    case "cap": return std(0xa8865c, 0.5);
    case "led": return std(0xf2f1ec, 0.2);
    case "socket": return std(0x2b2b2b, 0.6);
    case "steel": return std(0xb5b9bf, 0.3, 1);
    case "zinc": return std(0xc5c9ce, 0.35, 0.9);
    case "rubber": return std(0x0f0f0f, 0.95);
    case "cell": return std(0xbcbfc5, 0.35, 0.55);
    case "foam": return std(0x2c2c2c, 0.95);
    case "gold": return std(0xd9b45c, 0.25, 1);
    case "glow-charge": return glow(0xffa22e);
    case "glow-status": return glow(0x3a3a3a);
    case "glow-power": return glow(0x48ff7a);
    default: return std(0x18181a, 0.45);
  }
}

const canvas = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new THREE.RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(28, 1, 5, 6000);
camera.up.set(0, 0, 1);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 60;
controls.maxDistance = 1600;

const hemi = new THREE.HemisphereLight(0xffffff, 0x3a3a3a, 0.45);
hemi.position.set(0, 0, 1);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 1.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -320, right: 320, top: 320, bottom: -320, near: 10, far: 1500 });
key.shadow.bias = -0.0004;
scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0xdfe6ff, 0.7);
scene.add(rim, rim.target);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000), new THREE.ShadowMaterial({ opacity: 0.22 }));
ground.receiveShadow = true;
scene.add(ground);

const mats = {};
const groups = {};       // side -> { outer, inner, layers: { name: Group } }
const pickable = [];
const pivots = {};

function groupFor(side, layer) {
  if (!groups[side]) {
    const outer = new THREE.Group(), inner = new THREE.Group();
    const b = META.boxes[side];
    pivots[side] = new THREE.Vector3((b[0] + b[2]) / 2, (b[1] + b[3]) / 2, 0);
    if (side !== "dock") inner.position.copy(pivots[side]).negate();
    outer.add(inner);
    scene.add(outer);
    groups[side] = { outer, inner, layers: {} };
  }
  const g = groups[side];
  if (!g.layers[layer]) { g.layers[layer] = new THREE.Group(); g.inner.add(g.layers[layer]); }
  return g.layers[layer];
}

function build(buf) {
  const dummy = new THREE.Object3D();
  for (const m of META.meshes) {
    const q = new Uint16Array(buf, m.vo, m.nv * 3);
    const pos = new Float32Array(m.nv * 3);
    for (let i = 0; i < pos.length; i++) {
      const k = i % 3;
      pos[i] = m.lo[k] + (q[i] / 65535) * (m.hi[k] - m.lo[k]);
    }
    const idx = m.i32 ? new Uint32Array(buf, m.io, m.ni * 3) : new Uint16Array(buf, m.io, m.ni * 3);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    geo.setIndex(new THREE.BufferAttribute(idx, 1));
    geo.computeVertexNormals();
    const mat = mats[m.kind] || (mats[m.kind] = material(m.kind));
    let obj;
    if (m.inst) {
      obj = new THREE.InstancedMesh(geo, mat, m.inst.length);
      m.inst.forEach(([x, y, z, r], i) => {
        dummy.position.set(x, y, z);
        dummy.rotation.set(0, 0, (r * Math.PI) / 180);
        dummy.updateMatrix();
        obj.setMatrixAt(i, dummy.matrix);
      });
    } else {
      obj = new THREE.Mesh(geo, mat);
    }
    obj.castShadow = !m.kind.startsWith("glow");
    obj.receiveShadow = true;
    obj.userData = { label: m.label, info: m.info, kind: m.kind };
    groupFor(m.group, m.layer).add(obj);
    pickable.push(obj);
  }
}

// ---- Views --------------------------------------------------------------------------------
const GAP = 46, TILT = 11;   // on the desk: mm between the halves' inner edges beyond the dock's, degrees
function target(view) {
  const L = pivots.left, R = pivots.right, zd = META.z_dock, zk = META.z_desk;
  const s = {
    left: { p: L.clone().setZ(zd), rot: 0, show: true, ex: 0 },
    right: { p: R.clone().add(new THREE.Vector3(META.dx, 0, zd)), rot: 0, show: true, ex: 0 },
    dock: { show: true },
  };
  if (view === "desk") {
    s.left = { p: L.clone().add(new THREE.Vector3(-GAP / 2, -8, zk)), rot: -TILT, show: true, ex: 0 };
    s.right = { p: R.clone().add(new THREE.Vector3(META.dx + GAP / 2, -8, zk)), rot: TILT, show: true, ex: 0 };
    s.dock.show = false;
  } else if (view === "exploded") {
    s.left = { p: L.clone().setZ(zk + 14), rot: 0, show: true, ex: 1 };
    s.right = { ...s.right, show: false };
    s.dock.show = false;
  }
  return s;
}

function frame(view) {
  const b = META.boxes;
  let cx, cy, cz, r;
  if (view === "exploded") {
    cx = pivots.left.x; cy = pivots.left.y; cz = 52; r = 95;
  } else {
    cx = (b.dock[0] + b.dock[2]) / 2; cy = (b.dock[1] + b.dock[3]) / 2; cz = 8;
    r = Math.hypot(b.dock[2] - b.dock[0] + (view === "desk" ? GAP + 20 : 0), b.dock[3] - b.dock[1]) / 2;
  }
  const t = new THREE.Vector3(cx, cy, cz);
  const vfov = (camera.fov * Math.PI) / 180;
  const fit = Math.min(vfov, 2 * Math.atan(Math.tan(vfov / 2) * camera.aspect));
  const dist = (r / Math.sin(fit / 2)) * 0.8;
  const dir = view === "exploded" ? new THREE.Vector3(0.95, -1.25, 0.85) : new THREE.Vector3(0.28, -1.15, 0.9);
  return { t, p: t.clone().add(dir.normalize().multiplyScalar(dist)) };
}

function snapshot() {
  const s = {};
  for (const side of ["left", "right"]) {
    const g = groups[side];
    s[side] = { p: g.outer.position.clone(), rot: THREE.MathUtils.radToDeg(g.outer.rotation.z), show: g.outer.visible,
                ex: g.ex || 0 };
  }
  s.dock = { show: groups.dock.outer.visible };
  return s;
}

function apply(side, st) {
  const g = groups[side];
  g.outer.position.copy(st.p);
  g.outer.rotation.z = THREE.MathUtils.degToRad(st.rot);
  g.ex = st.ex;
  for (const [name, layer] of Object.entries(g.layers)) layer.position.z = (EXPLODE[name] || 0) * st.ex;
}

let view = "desk", anim = null;
const glowCharge = () => mats["glow-charge"], glowPower = () => mats["glow-power"];
function setLeds(v) {
  const docked = v === "dock";
  if (glowCharge()) glowCharge().color.set(docked ? 0xffa22e : 0x333333);
  if (glowPower()) glowPower().color.set(docked ? 0x48ff7a : 0x2a2a2a);
}

function go(v, instant) {
  const from = snapshot(), to = target(v), cam0 = { p: camera.position.clone(), t: controls.target.clone() };
  const cam1 = frame(v);
  const hop = (from.dock.show !== to.dock.show) || (view === "dock") !== (v === "dock");
  view = v;
  for (const b of document.querySelectorAll(".views button")) b.setAttribute("aria-pressed", String(b.dataset.view === v));
  groups.right.outer.visible = from.right.show || to.right.show;
  if (to.dock.show) groups.dock.outer.visible = true;
  setLeds(v);
  const done = () => {
    groups.right.outer.visible = to.right.show;
    groups.dock.outer.visible = to.dock.show;
  };
  const dur = instant || reduceMotion ? 0 : 1100;
  const t0 = performance.now();
  anim = now => {
    const k = dur ? Math.min(1, (now - t0) / dur) : 1;
    const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    for (const side of ["left", "right"]) {
      const a = from[side], b = to[side];
      const p = a.p.clone().lerp(b.p, e);
      if (hop) p.z += Math.sin(Math.PI * e) * 34;
      apply(side, { p, rot: a.rot + (b.rot - a.rot) * e, ex: a.ex + (b.ex - a.ex) * e });
    }
    camera.position.lerpVectors(cam0.p, cam1.p, e);
    controls.target.lerpVectors(cam0.t, cam1.t, e);
    if (k >= 1) { done(); anim = null; }
  };
  if (!dur) anim(performance.now());
}

// ---- X-ray and finishes ---------------------------------------------------------------------
let xray = false;
function setXray(on) {
  xray = on;
  document.getElementById("xray").setAttribute("aria-pressed", String(on));
  for (const k of ["print", "keycap", "switch"]) {
    const m = mats[k];
    if (!m) continue;
    m.transparent = on; m.opacity = on ? (k === "switch" ? 0.3 : 0.14) : 1; m.depthWrite = !on; m.needsUpdate = true;
  }
}

function finishes() {
  for (const row of document.querySelectorAll(".finish .row")) {
    const kind = row.dataset.target;
    const saved = store("urchin-finish-" + kind) || SWATCHES[0][1];
    const set = hex => {
      mats[kind] && mats[kind].color.set(hex).convertSRGBToLinear();
      store("urchin-finish-" + kind, hex);
      for (const b of row.querySelectorAll(".sw")) b.setAttribute("aria-pressed", String(b.dataset.hex === hex));
      picker.value = hex;
    };
    for (const [name, hex] of SWATCHES) {
      const b = document.createElement("button");
      b.className = "sw"; b.id = `sw-${kind}-${name.toLowerCase()}`; b.dataset.hex = hex;
      b.style.setProperty("--c", hex); b.title = name; b.setAttribute("aria-label", `${name} ${kind === "print" ? "prints" : "keycaps"}`);
      b.addEventListener("click", () => set(hex));
      row.appendChild(b);
    }
    const wrap = document.createElement("label");
    wrap.className = "pick"; wrap.title = "Any colour";
    const picker = document.createElement("input");
    picker.type = "color"; picker.id = `pick-${kind}`; picker.setAttribute("aria-label", `Any colour for the ${kind === "print" ? "prints" : "keycaps"}`);
    picker.addEventListener("input", () => set(picker.value));
    wrap.appendChild(picker); row.appendChild(wrap);
    set(saved);
  }
}

// ---- Pointing at parts ------------------------------------------------------------------------
const tip = document.getElementById("tip");
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let pointer = null, moved = false, tipTimer = 0;
function shown(o) { for (; o; o = o.parent) if (!o.visible) return false; return true; }
function pick(x, y) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((x - r.left) / r.width) * 2 - 1, -((y - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const live = pickable.filter(o => shown(o) && !(xray && o.material.transparent));
  const hit = ray.intersectObjects(live, false)[0];
  if (!hit) { tip.hidden = true; return; }
  const { label, info } = hit.object.userData;
  tip.innerHTML = "";
  const s = document.createElement("strong"); s.textContent = label; tip.appendChild(s);
  if (info) { const e = document.createElement("em"); e.textContent = info; tip.appendChild(e); }
  const w = innerWidth, flip = x > w - 300;
  tip.style.transform = `translate(${flip ? x - 14 - Math.min(288, tip.offsetWidth || 240) : x + 14}px, ${y + 14}px)`;
  tip.hidden = false;
}
canvas.addEventListener("pointermove", e => { if (e.pointerType === "mouse") pointer = [e.clientX, e.clientY]; else moved = true; });
canvas.addEventListener("pointerleave", () => { pointer = null; tip.hidden = true; });
canvas.addEventListener("pointerdown", () => { moved = false; });
canvas.addEventListener("pointerup", e => {
  if (e.pointerType === "mouse" || moved) return;
  pick(e.clientX, e.clientY);
  clearTimeout(tipTimer); tipTimer = setTimeout(() => { tip.hidden = true; }, 2600);
});

// ---- Loop ----------------------------------------------------------------------------------
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);

function lights() {
  const t = controls.target;
  key.target.position.copy(t); key.position.copy(t).add(new THREE.Vector3(-260, -320, 620));
  rim.target.position.copy(t); rim.position.copy(t).add(new THREE.Vector3(300, 420, 260));
}

function loop(now) {
  if (anim) anim(now);
  controls.update();
  lights();
  if (pointer) { pick(pointer[0], pointer[1]); pointer = null; }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

function spec() {
  const s = META.spec;
  const el = document.getElementById("spec");
  el.innerHTML = "";
  const parts = [
    [`${s.keys}`, " keys, Choc low profile"],
    [`${s.half_mm[0]}\u00a0×\u00a0${s.half_mm[1]}\u00a0mm`, " per half"],
    [`${s.height_mm}\u00a0mm`, " tall on its feet"],
    [`${s.dock_mm[0]}\u00a0×\u00a0${s.dock_mm[1]}\u00a0mm`, " dock"],
  ];
  parts.forEach(([n, t], i) => {
    const b = document.createElement("b"); b.textContent = n;
    el.append(b, t + (i < parts.length - 1 ? " · " : ""));
  });
}

(async () => {
  const status = document.getElementById("status");
  try {
    if (typeof DecompressionStream === "undefined") throw new Error("no DecompressionStream");
    build(await inflate(DATA));
  } catch (err) {
    status.textContent = "This browser can't unpack the model. Open the page in a current Chrome, Safari or Firefox.";
    return;
  }
  status.hidden = true;
  spec();
  finishes();
  resize();
  for (const b of document.querySelectorAll(".views button")) b.addEventListener("click", () => go(b.dataset.view));
  document.getElementById("xray").addEventListener("click", () => setXray(!xray));
  go("desk", true);
  requestAnimationFrame(loop);
})();
</script>
