[project]
name = "mech"
version = "0.1.0"
description = "urchin++ mechanical CAD: printed cases for both halves and the charging dock tray (build123d)"
readme = "README.md"
authors = [
    { name = "Frederic Branczyk", email = "fbranczyk@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "build123d>=0.13.0",
    "ocp-vscode>=4.2.0",
    "scipy>=1.17",
    "vtk>=9.3",
]

[project.scripts]
mech = "mech.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
