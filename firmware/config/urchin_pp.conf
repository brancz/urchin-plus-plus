# urchin++ (both halves). Carried over from brancz/urchin-zmk-firmware's urchin.conf.

# TX power: +8 dBm, the board's default (firmware/boards/urchin_pp/Kconfig.defconfig)

# Deep sleep after 30 minutes idle; a key press wakes the half (it then reconnects).
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Status LED (zmk-rgbled-widget): battery level on wake, connection state on profile change
CONFIG_RGBLED_WIDGET=y
