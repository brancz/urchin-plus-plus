# ZMK workspace for urchin++ (west init -l; scripts/firmware/build.sh copies this file
# into firmware/build/ws/config). Every project is pinned to a commit: ZMK main as of
# 2026-10-09, the zmk-rgbled-widget main branch (it tracks ZMK main), and Zephyr. ZMK's
# own manifest names Zephyr by a branch (v4.1.0+zmk-fixes), so the zephyr entry below
# overrides it with that branch's commit, keeping ZMK's import blocklist. Zephyr's import
# also blocks hal_stm32 and lvgl, so ZMK's own pins for those two apply, as they would with
# ZMK's manifest alone.
manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: caksoylar
      url-base: https://github.com/caksoylar
  projects:
    - name: zephyr
      remote: zmkfirmware
      revision: 10ba6d0cb38bc3d258775d27982f707599320085  # v4.1.0+zmk-fixes
      clone-depth: 1
      import:
        name-blocklist:
          - ci-tools
          - hal_altera
          - hal_cypress
          - hal_infineon
          - hal_microchip
          - hal_nxp
          - hal_openisa
          - hal_xtensa
          - hal_st
          - hal_ti
          - loramac-node
          - mcuboot
          - mcumgr
          - net-tools
          - openthread
          - edtt
          - trusted-firmware-m
          - hal_stm32
          - lvgl
    - name: zmk
      remote: zmkfirmware
      revision: 4dd95d7840eb3d5a3f59bb29fbf1ab054715ef85
      import: app/west.yml
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: e6b467792a1dabef8cfa5c9fd26bfefc9c16662b
  # ZMK's manifest enables Zephyr's optional group (nanopb for ZMK Studio, among others);
  # with Zephyr imported here instead, the top-level manifest has to say so.
  group-filter: [+optional]
  self:
    path: config
