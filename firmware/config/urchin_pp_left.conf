# urchin++ left half only (the split central); ZMK adds this to urchin_pp.conf for the left build.

# Fetch the right half's battery level over the split link...
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# ...and offer it to the host as a second Battery Service. macOS shows only the first
# (the left half); a Bluetooth app or script can read both.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
# The left half's LED blinks its own level, then the right half's (on wake and with &ind_bat)
CONFIG_RGBLED_WIDGET_BATTERY_SHOW_PERIPHERALS=y
