name: pages

# Publishes the 3D preview of the finished keyboard as the repo's GitHub Pages site,
# https://brancz.github.io/urchin-plus-plus/. The page is the committed copy of
# `mech preview` (reports/phase7/preview.html); recommit it when the printed parts change.

on:
  push:
    branches: [main]
    paths:
      - reports/phase7/preview.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: 3D preview
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Site
        run: |
          mkdir site
          cp reports/phase7/preview.html site/index.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
